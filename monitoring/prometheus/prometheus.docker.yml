global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/exam-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["52.59.86.56:9100"]
        labels:
          instance: "exam-cp"
          env: exam
      - targets: ["63.176.147.227:9100"]
        labels:
          instance: "exam-w1"
          env: exam
      - targets: ["3.71.181.214:9100"]
        labels:
          instance: "exam-w2"
          env: exam

  - job_name: devops-exam-app
    metrics_path: /metrics
    static_configs:
      - targets: ["52.59.86.56:30080"]
        labels:
          app: devops-exam-app
          env: exam
          via: nodeport-cp
      - targets: ["devops-exam-nlb-24ed18fcdecb3ba1.elb.eu-central-1.amazonaws.com:80"]
        labels:
          app: devops-exam-app
          env: exam
          via: nlb
