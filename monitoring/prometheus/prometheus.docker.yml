global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/exam-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["192.168.1.80:9100"]
        labels:
          instance: "jenkins"
      - targets: ["192.168.1.70:9100"]
        labels:
          instance: "raspberrypi"
      - targets: ["63.184.114.206:9100"]
        labels:
          instance: "exam-cp"
          env: exam
      - targets: ["18.184.182.88:9100"]
        labels:
          instance: "exam-w1"
          env: exam
      - targets: ["18.193.83.196:9100"]
        labels:
          instance: "exam-w2"
          env: exam

  - job_name: devops-exam-app
    metrics_path: /metrics
    static_configs:
      - targets: ["63.184.114.206:30080"]
        labels:
          app: devops-exam-app
          env: exam