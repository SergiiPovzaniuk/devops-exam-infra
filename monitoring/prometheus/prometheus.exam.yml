global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["localhost:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets:
          - "63.184.114.206:9100"
          - "18.184.182.88:9100"
          - "18.193.83.196:9100"
        labels:
          env: exam

  - job_name: devops-exam-app
    metrics_path: /metrics
    static_configs:
      - targets:
          - "63.184.114.206:30080"
        labels:
          app: devops-exam-app