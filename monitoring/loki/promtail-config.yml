server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://LOKI_HOST:3100/loki/api/v1/push

scrape_configs:
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          host: HOSTNAME
          __path__: /var/log/*.log

  - job_name: containers
    static_configs:
      - targets: [localhost]
        labels:
          job: containers
          host: HOSTNAME
          __path__: /var/log/containers/*.log