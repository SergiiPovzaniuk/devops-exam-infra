---
# Run after terraform apply:
# ansible-playbook playbooks/generate_inventory.yml -e cp_ip=x -e w1_ip=y -e w2_ip=z
- hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Write inventory
      copy:
        dest: "{{ playbook_dir }}/../inventory/hosts.ini"
        content: |
          [control_plane]
          cp ansible_host={{ cp_ip }}

          [workers]
          w1 ansible_host={{ w1_ip }}
          w2 ansible_host={{ w2_ip }}

          [k8s:children]
          control_plane
          workers

          [k8s:vars]
          ansible_user=ubuntu
          ansible_ssh_private_key_file={{ key_path | default('~/.ssh/devops-exam') }}
